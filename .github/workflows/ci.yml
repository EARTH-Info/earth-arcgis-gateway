name: CI

on:
  push:
    branches:
      - master
      - feat/modern-dotnet-earthid-gateway
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore gateway
        run: dotnet restore src/Earth.ArcGIS.Gateway/Earth.ArcGIS.Gateway.csproj

      - name: Restore tests
        run: dotnet restore tests/Earth.ArcGIS.Gateway.Tests/Earth.ArcGIS.Gateway.Tests.csproj

      - name: Initialize ClickHouse schema
        run: |
          CLICKHOUSE_CONTAINER="$(docker ps --filter ancestor=clickhouse/clickhouse-server:25.8 --format '{{.ID}}' | head -1)"
          test -n "$CLICKHOUSE_CONTAINER"
          docker exec -i "$CLICKHOUSE_CONTAINER" clickhouse-client --multiquery < deploy/clickhouse-schema.sql
          TABLE_COUNT="$(docker exec "$CLICKHOUSE_CONTAINER" clickhouse-client --query "SELECT count() FROM system.tables WHERE database=currentDatabase() AND name IN ('gateway_telemetry','gateway_admin_audit')")"
          test "$TABLE_COUNT" = "2"

      - name: Build gateway
        run: dotnet build src/Earth.ArcGIS.Gateway/Earth.ArcGIS.Gateway.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Earth.ArcGIS.Gateway.Tests/Earth.ArcGIS.Gateway.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Build production container
        run: docker build --pull -t earth-arcgis-gateway:ci .

      - name: Production container non-root smoke
        run: |
          test "$(docker image inspect earth-arcgis-gateway:ci --format '{{.Config.User}}')" = "gateway"
          mkdir -p "$RUNNER_TEMP/gateway-spool"
          chmod 0777 "$RUNNER_TEMP/gateway-spool"
          docker run --rm \
            --read-only \
            --tmpfs /tmp \
            -v "$RUNNER_TEMP/gateway-spool:/app/data/telemetry-spool" \
            --entrypoint sh \
            earth-arcgis-gateway:ci \
            -c 'test -w /app/data/telemetry-spool && touch /app/data/telemetry-spool/runtime-smoke && rm /app/data/telemetry-spool/runtime-smoke'

      - name: Dependency vulnerability audit
        run: dotnet list src/Earth.ArcGIS.Gateway/Earth.ArcGIS.Gateway.csproj package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/Earth.ArcGIS.Gateway.Tests/TestResults/*.trx
          if-no-files-found: warn
